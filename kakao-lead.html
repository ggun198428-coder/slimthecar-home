<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>차종 선택 - 슬림더카</title>
<style>
  :root{
    --teal:#00aabe; --teal-dark:#008a9b; --teal-tint:#e1f5ee;
    --ink:#1b232b; --ink-soft:#6b7684; --line:#e5e9ec; --bg:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;color:var(--ink);background:#f7f9fa}
  .kl-root{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;padding:20px 18px 100px}
  .kl-crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;min-height:24px}
  .kl-crumb{font-size:12px;background:var(--teal-tint);color:#085041;padding:4px 10px;border-radius:100px;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
  .kl-crumb:active{background:#c9ecdf}
  .kl-crumb .reset-icon{font-size:11px;opacity:.7}
  .kl-step-label{font-size:12px;color:var(--teal-dark);font-weight:600;margin-bottom:4px}
  .kl-title{font-size:19px;font-weight:700;margin:0 0 4px}
  .kl-sub{font-size:13px;color:var(--ink-soft);margin:0 0 18px}
  .kl-group-label{font-size:12px;color:var(--ink-soft);font-weight:600;margin:14px 0 8px}
  .kl-group-label:first-child{margin-top:0}
  .kl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kl-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;background:#fff;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:8px}
  .kl-card:active{border-color:var(--teal);background:var(--teal-tint)}
  .kl-card .logo{width:36px;height:36px;object-fit:contain}
  .kl-card .logo-fallback{width:36px;height:36px;border-radius:50%;background:var(--teal-tint);color:var(--teal-dark);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .kl-row{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:8px;background:#fff;cursor:pointer;font-family:inherit;font-size:14px;font-weight:500;width:100%;text-align:left}
  .kl-row:active{border-color:var(--teal);background:var(--teal-tint)}
  .kl-opt-card{border:1.5px solid var(--line);border-radius:12px;padding:16px 10px;text-align:center;background:#fff;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:500}
  .kl-opt-card:active{border-color:var(--teal);background:var(--teal-tint)}
  .kl-other{color:var(--ink-soft)}
  .kl-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;max-width:480px;margin:0 auto;display:flex;gap:10px}
  .kl-btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .kl-btn.ghost{background:#f1f3f4;color:var(--ink);flex:0 0 84px}
  .kl-btn.primary{background:var(--teal);color:#fff}
  .kl-btn.primary:disabled{background:#c7d2d6;cursor:not-allowed}
  .kl-input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;margin-top:10px}
  .kl-input:focus{outline:none;border-color:var(--teal)}
  textarea.kl-input{resize:none;min-height:90px}
  .kl-err{font-size:12px;color:#c65b28;margin-top:6px;display:none}
  .kl-result-box{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px}
  .kl-result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .kl-result-row:last-child{border-bottom:none}
  .kl-result-row .l{color:var(--ink-soft)}
  .kl-result-row .v{font-weight:600;text-align:right}
  .kl-cta-row{display:flex;gap:10px}
  .kl-cta{flex:1;text-align:center;padding:15px 8px;border-radius:12px;font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit;border:none}
  .kl-cta.kakao{background:var(--teal);color:#fff}
  .kl-cta.save{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .kl-saved-msg{font-size:12px;color:#0f6e56;text-align:center;margin-top:10px;display:none}
</style>
</head>

var OTHER = '기타(직접입력)';

(function(){
var root = document.getElementById('kakao-lead-root');
var state = {step:0, brand:null, brandOther:'', model:null, modelOther:'', fuel:null, fuelOther:'', memo:''};
var showNextBtn = false; // 기타(직접입력) 대기 중이거나 메모 단계일 때만 true

function h(tag, attrs, children){
 var el = document.createElement(tag);
 for (var k in attrs||{}) {
  if (k==='text') el.textContent = attrs[k];
  else if (k==='html') el.innerHTML = attrs[k];
  else el.setAttribute(k, attrs[k]);
 }
 (children||[]).forEach(function(c){ if(c) el.appendChild(c); });
 return el;
}

function currentBrandModels(){
 if (!state.brand) return [];
 return DATA.models[state.brand.id] || [];
}
function currentModel(){
 var list = currentBrandModels();
 return list.filter(function(m){ return m.name === state.model; })[0] || null;
}
function fuelStepLabel(){
 return (state.brand && DATA.fuelLabel[state.brand.id]) || '연료';
}

function renderCrumbs(container){
 container.innerHTML = '';
 var items = [];
 if (state.step > 0) items.push({label: state.brand ? state.brand.name : state.brandOther, step:0});
 if (state.step > 1) items.push({label: state.model === OTHER ? state.modelOther : state.model, step:1});
 if (state.step > 2) items.push({label: state.fuel === OTHER ? state.fuelOther : state.fuel, step:2});
 items.forEach(function(it){
  var chip = h('button',{class:'kl-crumb',type:'button'});
  chip.appendChild(document.createTextNode(it.label));
  chip.appendChild(h('span',{class:'reset-icon',text:'\u21BA'}));
  chip.onclick = function(){ goTo(it.step); };
  container.appendChild(chip);
 });
}

function goTo(step){ state.step = step; render(); }

// 브랜드/차종/연료를 고르면 하위 선택값을 초기화하고 바로 다음 단계로
function selectBrand(b){
 state.brand = b; state.brandOther='';
 state.model=null; state.modelOther=''; state.fuel=null; state.fuelOther='';
 goTo(1);
}
function selectModel(name){
 state.model = name; state.modelOther='';
 state.fuel=null; state.fuelOther='';
 goTo(2);
}
function selectFuel(f){
 state.fuel = f; state.fuelOther='';
 goTo(3);
}

function render(){
 root.innerHTML = '';
 showNextBtn = false;
 var wrap = h('div',{class:'kl-root'});
 var crumbs = h('div',{class:'kl-crumbs'});
 wrap.appendChild(crumbs);

 var stepLabel = h('div',{class:'kl-step-label'});
 var title = h('h2',{class:'kl-title'});
 var sub = h('p',{class:'kl-sub'});
 var body = h('div',{});
 wrap.appendChild(stepLabel); wrap.appendChild(title); wrap.appendChild(sub); wrap.appendChild(body);
 root.appendChild(wrap);
 renderCrumbs(crumbs);

 if (state.step === 0) {
  stepLabel.textContent = '1 · 브랜드';
  title.textContent = '어떤 브랜드를 찾고 계신가요?';
  sub.textContent = '국산·수입 브랜드에서 선택해주세요';
  renderBrandStep(body);
 } else if (state.step === 1) {
  stepLabel.textContent = '2 · 차종';
  title.textContent = (state.brand?state.brand.name:state.brandOther) + ' 어떤 차종을 찾고 계신가요?';
  sub.textContent = '차종을 골라주세요';
  renderModelStep(body);
 } else if (state.step === 2) {
  stepLabel.textContent = '3 · ' + fuelStepLabel();
  title.textContent = (state.model===OTHER?state.modelOther:state.model) + ' 어떤 ' + fuelStepLabel() + '(으)로 찾으세요?';
  sub.textContent = '해당하는 걸 선택해주세요';
  renderFuelStep(body);
 } else if (state.step === 3) {
  stepLabel.textContent = '4 · 옵션/색상';
  title.textContent = '원하는 옵션이나 색상이 있나요?';
  sub.textContent = "없으면 '없음'이라고 적어주세요";
  showNextBtn = true;
  renderMemoStep(body);
 } else if (state.step === 4) {
  stepLabel.textContent = '5 · 완료';
  title.textContent = '선택하신 내용이에요';
  sub.textContent = '';
  renderResultStep(body);
 }

 if (state.step < 4) {
  var nav = h('div',{class:'kl-nav'});
  var back = h('button',{class:'kl-btn ghost',text:'이전'});
  back.style.visibility = state.step===0 ? 'hidden' : 'visible';
  back.onclick = function(){ goTo(state.step-1); };
  nav.appendChild(back);
  if (showNextBtn) {
   var next = h('button',{class:'kl-btn primary',text:'다음'});
   next.disabled = true;
   next.id = 'klNext';
   next.onclick = function(){ handleNext(); };
   nav.appendChild(next);
  }
  root.appendChild(nav);
  window._klValidate = null;
 }
}

// "기타(직접입력)"를 고르면 입력창 + 확인용 다음 버튼을 보여줌
function activateOther(placeholder, onConfirm){
 showNextBtn = true;
 var nav = document.querySelector('.kl-nav');
 if (nav && !document.getElementById('klNext')) {
  var next = h('button',{class:'kl-btn primary',text:'다음'});
  next.disabled = true;
  next.id = 'klNext';
  next.onclick = function(){
   var val = (window._klOtherValue||'').trim();
   if (!val) return;
   onConfirm(val);
  };
  nav.appendChild(next);
 }
}

function makeOtherInput(placeholder, onConfirm){
 var box = h('div',{});
 var input = h('input',{class:'kl-input',type:'text',placeholder:placeholder});
 box.appendChild(input);
 input.oninput = function(){
  window._klOtherValue = input.value.trim();
  var nextBtn = document.getElementById('klNext');
  if (nextBtn) nextBtn.disabled = input.value.trim().length===0;
 };
 input.onkeydown = function(e){
  if (e.key === 'Enter') {
   var nextBtn = document.getElementById('klNext');
   if (nextBtn && !nextBtn.disabled) nextBtn.click();
  }
 };
 box.style.display = 'none';
 box._input = input;
 box._activate = function(){
  box.style.display = 'block';
  activateOther('', onConfirm);
  input.focus();
 };
 return box;
}

function highlightSelected(container, selector, el){
 container.querySelectorAll(selector).forEach(function(x){x.style.borderColor='';x.style.background='';});
 el.style.borderColor='#00aabe'; el.style.background='#e1f5ee';
}

function renderBrandStep(body){
 var dom = DATA.brands.filter(function(b){return b.origin==='domestic';});
 var imp = DATA.brands.filter(function(b){return b.origin==='import';});
 body.appendChild(h('div',{class:'kl-group-label',text:'국산 브랜드'}));
 body.appendChild(brandGrid(dom));
 body.appendChild(h('div',{class:'kl-group-label',text:'수입 브랜드'}));
 body.appendChild(brandGrid(imp));
 body.appendChild(h('div',{class:'kl-group-label',text:'목록에 없나요?'}));
 var otherCard = h('button',{class:'kl-row kl-other',text:OTHER});
 var otherBox = makeOtherInput('브랜드명을 입력해주세요', function(val){
  state.brandOther = val; state.brand = null;
  state.model=null; state.modelOther=''; state.fuel=null; state.fuelOther='';
  goTo(1);
 });
 otherCard.onclick = function(){ otherBox._activate(); };
 body.appendChild(otherCard);
 body.appendChild(otherBox);
}
function brandGrid(list){
 var grid = h('div',{class:'kl-grid'});
 list.forEach(function(b){
  var card = h('button',{class:'kl-card',type:'button'});
  var img = h('img',{class:'logo',src:b.logoUrl,alt:b.name});
  img.onerror = function(){
   var fb = h('div',{class:'logo-fallback',text:b.name.slice(0,2)});
   img.replaceWith(fb);
  };
  card.appendChild(img);
  card.appendChild(h('span',{text:b.name}));
  card.onclick = function(){ selectBrand(b); };
  grid.appendChild(card);
 });
 return grid;
}

function renderModelStep(body){
 var list = currentBrandModels();
 var hasCat = list.some(function(m){return m.cat;});
 if (hasCat) {
  var cats = [];
  list.forEach(function(m){ if(cats.indexOf(m.cat)===-1) cats.push(m.cat); });
  cats.forEach(function(cat){
   body.appendChild(h('div',{class:'kl-group-label',text:cat}));
   var grid = h('div',{class:'kl-grid'});
   list.filter(function(m){return m.cat===cat;}).forEach(function(m){
    grid.appendChild(modelCard(m));
   });
   body.appendChild(grid);
  });
 } else {
  var grid = h('div',{class:'kl-grid'});
  list.forEach(function(m){ grid.appendChild(modelCard(m)); });
  body.appendChild(grid);
 }
 body.appendChild(h('div',{class:'kl-group-label',text:'목록에 없나요?'}));
 var otherRow = h('button',{class:'kl-row kl-other',text:OTHER});
 var otherBox = makeOtherInput('차종명을 입력해주세요', function(val){
  state.modelOther = val; state.model = OTHER;
  state.fuel=null; state.fuelOther='';
  goTo(2);
 });
 otherRow.onclick = function(){ otherBox._activate(); };
 body.appendChild(otherRow);
 body.appendChild(otherBox);
}
function modelCard(m){
 var card = h('button',{class:'kl-opt-card',text:m.name});
 card.onclick = function(){ selectModel(m.name); };
 return card;
}

function renderFuelStep(body){
 var m = currentModel();
 var fuels = m ? m.fuels : [];
 var grid = h('div',{class:'kl-grid'});
 fuels.forEach(function(f){
  var card = h('button',{class:'kl-opt-card',text:f});
  card.onclick = function(){ selectFuel(f); };
  grid.appendChild(card);
 });
 body.appendChild(grid);
 body.appendChild(h('div',{class:'kl-group-label',text:'목록에 없나요?'}));
 var otherRow = h('button',{class:'kl-row kl-other',text:OTHER});
 var otherBox = makeOtherInput(fuelStepLabel()+'을(를) 입력해주세요', function(val){
  state.fuelOther = val; state.fuel = OTHER;
  goTo(3);
 });
 otherRow.onclick = function(){ otherBox._activate(); };
 body.appendChild(otherRow);
 body.appendChild(otherBox);
}

function renderMemoStep(body){
 var ta = h('textarea',{class:'kl-input',placeholder:"예: 없음 / 선루프 있으면 좋겠어요 / 화이트색 원해요"});
 var err = h('div',{class:'kl-err',text:"내용을 입력해주세요 ('없음'도 좋아요)"});
 body.appendChild(ta); body.appendChild(err);
 ta.oninput = function(){
  var nextBtn = document.getElementById('klNext');
  if (nextBtn) nextBtn.disabled = ta.value.trim().length===0;
  err.style.display='none';
 };
 window._klMemoInput = ta;
 window._klValidate = function(){
  if (ta.value.trim().length===0){ err.style.display='block'; return false; }
  state.memo = ta.value.trim();
  return true;
 };
}

function renderResultStep(body){
 var box = h('div',{class:'kl-result-box'});
 function row(l,v){
  var r = h('div',{class:'kl-result-row'});
  r.appendChild(h('span',{class:'l',text:l}));
  r.appendChild(h('span',{class:'v',text:v}));
  box.appendChild(r);
 }
 row('브랜드', state.brand?state.brand.name:state.brandOther);
 row('차종', state.model===OTHER?state.modelOther:state.model);
 row(fuelStepLabel(), state.fuel===OTHER?state.fuelOther:state.fuel);
 row('메모', state.memo);
 body.appendChild(box);

 var ctaRow = h('div',{class:'kl-cta-row'});
 var kakao = h('a',{class:'kl-cta kakao',href:KAKAO_URL,target:'_blank',text:'부담없이 카톡으로 상담하기'});
 var save = h('button',{class:'kl-cta save',text:'결과만 저장하기'});
 var savedMsg = h('div',{class:'kl-saved-msg',text:'저장했어요. 필요하실 때 편하게 다시 찾아주세요.'});

 var alreadySaved = false;
 function saveToSheet(){
  if (alreadySaved) return; // 두 버튼 중 하나라도 이미 저장했으면 중복 전송 방지
  alreadySaved = true;
  var payload = {
   _sheet: '카톡유입',
   '브랜드': state.brand?state.brand.name:state.brandOther,
   '모델': state.model===OTHER?state.modelOther:state.model,
   '연료': state.fuel===OTHER?state.fuelOther:state.fuel,
   '옵션색상메모': state.memo,
   '유입경로': 'kakao-lead'
  };
  fetch(SUBMIT_ENDPOINT, {method:'POST', mode:'no-cors', body: JSON.stringify(payload)}).catch(function(){});
 }

 kakao.addEventListener('click', function(){
  saveToSheet(); // 카톡으로 바로 넘어가도 상담사가 차종을 다시 안 물어보도록 항상 같이 저장
 });

 save.onclick = function(){
  saveToSheet();
  save.disabled = true; save.textContent = '저장 중...';
  setTimeout(function(){
   save.textContent='결과만 저장하기'; save.disabled=false; savedMsg.style.display='block';
  }, 400);
 };
 ctaRow.appendChild(kakao); ctaRow.appendChild(save);
 body.appendChild(ctaRow);
 body.appendChild(savedMsg);
}

function handleNext(){
 if (state.step===3) { if (window._klValidate && !window._klValidate()) return; }
 if (state.step < 4) goTo(state.step+1);
}

render();
})();
</script>
</body>
</html>
