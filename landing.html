<style>
  :root{ --ink:#0B2545; --teal:#00aabe; --teal-soft:#e3f6f8; --dim:#6b7684; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; background:#fff; font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif; color:var(--ink); overflow:hidden; word-break:keep-all; }

  #stage{ position:fixed; inset:0; }
  section{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:8vw; overflow:hidden; background:#fff;
    opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  section.active{ opacity:1; pointer-events:auto; }

  .wipe{ position:absolute; inset:-2px; background:var(--teal); z-index:6; pointer-events:none; clip-path:polygon(0 0,0 0,0 100%,0 100%); }
  section.active .wipe{ animation:wipe .62s cubic-bezier(.7,0,.15,1) forwards; }
  @keyframes wipe{
    0%{ clip-path:polygon(0 0,0 0,0 100%,0 100%); }
    45%{ clip-path:polygon(0 0,100% 0,100% 100%,0 100%); }
    55%{ clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%); opacity:1; }
    100%{ clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%); opacity:0; }
  }
  .flash{ position:absolute; inset:0; background:#fff; z-index:5; pointer-events:none; opacity:0; }
  section.active .flash{ animation:flash .62s ease forwards; }
  @keyframes flash{ 0%,44%{opacity:0;} 52%{opacity:1;} 100%{opacity:0;} }

  .num-row{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:0; display:flex; align-items:center; gap:11vw; user-select:none;
  }
  .num-row .cur{
    font-weight:800; color:var(--teal-soft); font-size:min(58vw,500px); line-height:1;
    opacity:0; transform:scale(.5) rotate(-8deg);
    transition:opacity 1s ease .4s, transform 1.2s cubic-bezier(.16,1,.3,1) .4s;
  }
  section.active .num-row .cur{ opacity:1; transform:scale(1) rotate(0deg); }
  .num-row .side{
    font-weight:700; color:var(--teal-soft); font-size:min(7vw,52px); line-height:1;
    opacity:0; cursor:pointer; z-index:41; position:relative; padding:2vh 4vw;
    display:flex; align-items:center; gap:6px;
    transition:opacity .8s ease .6s, color .2s ease;
  }
  section.active .num-row .side{ opacity:.65; }
  .num-row .side:hover{ color:var(--teal); }
  .num-row .side .arrow{ font-size:0.6em; }

  .content{ position:relative; z-index:2; text-align:center; max-width:760px; }
  section.shake .content{ animation:shake .5s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake{
    10%,90%{transform:translate3d(-2px,0,0);} 20%,80%{transform:translate3d(4px,0,0);}
    30%,50%,70%{transform:translate3d(-8px,0,0);} 40%,60%{transform:translate3d(8px,0,0);}
  }

  .txt{ font-size:clamp(28px,7.2vw,58px); font-weight:800; line-height:1.34; letter-spacing:-.01em; word-break:keep-all; }
  .txt .word{ display:inline-block; }
  .txt .ch{ display:inline-block; opacity:0; transform:translateY(4px); transition:opacity .12s linear, transform .12s linear; }
  section.active .txt .ch{ opacity:1; transform:translateY(0); }
  .txt .em{ color:var(--teal); }

  .sub{
    margin-top:20px; font-size:clamp(13px,2.8vw,17px); font-weight:700; color:var(--dim);
    opacity:0; transform:translateY(20px) scale(.9);
    transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.6,.5,1);
  }
  section.active .sub{ opacity:1; transform:translateY(0) scale(1); }

  .topbar{ position:fixed; top:0; left:0; right:0; padding:14px 12px 0; z-index:60; display:flex; gap:5px; }
  .topbar .seg{ flex:1; height:3px; background:rgba(11,37,69,.15); border-radius:2px; overflow:hidden; }
  .topbar .seg i{ display:block; height:100%; width:0%; background:var(--teal); }
  .topbar .seg.fill i{ transition:width linear; width:100%; }
  .topbar .seg.done i{ width:100%; transition:none; }

  .brandmark{ position:fixed; top:26px; left:18px; z-index:59; height:18px; opacity:.9; }
  .brandmark img{ height:100%; display:block; }

  .bgline{ position:absolute; inset:0; overflow:hidden; pointer-events:none; opacity:.55; z-index:1; }
  .bgline svg{ width:170%; height:170%; position:absolute; left:-35%; top:-35%; }
  .bgline path{ stroke:var(--teal-soft); stroke-width:2.6; fill:none; stroke-dasharray:9 12; animation:flow 3.2s linear infinite; }
  @keyframes flow{ to{ stroke-dashoffset:-260; } }

  .icons{ display:flex; gap:18px; margin-top:28px; justify-content:center; flex-wrap:wrap; }
  .icons div{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    opacity:0; transform:translate(var(--tx,0),var(--ty,-120px)) scale(.2) rotate(var(--tr,120deg));
    transition:opacity .8s cubic-bezier(.3,1.9,.4,1), transform 1s cubic-bezier(.3,1.9,.4,1);
  }
  section.active .icons div{ opacity:1; transform:translate(0,0) scale(1) rotate(0deg); }
  .icons div:nth-child(1){ --tx:-160px; --ty:-40px; --tr:-160deg; }
  .icons div:nth-child(2){ --tx:0; --ty:-160px; --tr:200deg; }
  .icons div:nth-child(3){ --tx:0; --ty:160px; --tr:-200deg; }
  .icons div:nth-child(4){ --tx:160px; --ty:40px; --tr:160deg; }
  .icons .dot{
    width:58px; height:58px; border-radius:50%; background:var(--teal-soft);
    display:flex; align-items:center; justify-content:center; color:var(--teal);
    box-shadow:0 0 0 0 rgba(0,170,190,.4); animation:pulse 1.6s ease-in-out infinite;
  }
  .icons .dot svg{ width:26px; height:26px; }

<div class="topbar" id="topbar"></div>
<div id="stage"></div>

<script>
  const STEP = 0.1;
  const HOLD = 1.4;
  const TEAL = "#00aabe";
  // 문자/광고 캠페인 등에서 붙는 ?utm_source=... 같은 쿼리스트링을 그대로 보존해서
  // 다음 페이지(score.html)로 넘겨줍니다. score.html에서 이 값을 보고 캠페인 유입을
  // 구분해서 상담신청 알림에 표시합니다.
  const qs = location.search;

  const icons = {
    cash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M5.5 9v0M18.5 15v0"/></svg>`,
    card: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.2"/><path d="M2.5 9.5h19"/><path d="M6 14.5h4"/></svg>`,
    doc:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h9l4 4v14.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-17.5a1 1 0 0 1 1-1z"/><path d="M14.5 2.5v4.5h4"/><path d="M8 13h8M8 16.5h5.5"/></svg>`,
    car:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v-3.2a2 2 0 0 1 .5-1.3l1.8-2.2A2 2 0 0 1 7.8 8.5h8.4a2 2 0 0 1 1.5.7l1.8 2.2a2 2 0 0 1 .5 1.3V16"/><path d="M3.5 16h17v2a1 1 0 0 1-1 1h-1.5a1 1 0 0 1-1-1v-1h-11v1a1 1 0 0 1-1 1H4.5a1 1 0 0 1-1-1v-2z"/><circle cx="7.5" cy="16" r="1.6"/><circle cx="16.5" cy="16" r="1.6"/></svg>`
  };

  const slides = [
    { text:"저렴한 월 납입금을 보고 <br> 상담을 신청했는데, <br> <em>그 가격이</em> <em>맞았나요?</em>" },
    { text:"온라인에 검색만 해도 나오는 <br> <em>실시간 비교 견적</em>, <br> 과연 믿을만할까요?" },
    { text:"장기렌트가 다들 좋다던데, <em>정말 나한테도</em> 맞을까요?" },
    { text:"자동차 이용은 <em>경우의 수</em>가 너무나 많습니다." },
    { text:"어떤 방식이 좋다는 없습니다.", last:true }
  ];

  const stage = document.getElementById('stage');
  const topbar = document.getElementById('topbar');
  let sectionDurations = [];

  slides.forEach((s, idx) => {
    const sec = document.createElement('section');
    sec.dataset.i = idx;

    let charCount = 0;
    for (const ch of s.text.replace(/<\/?em>/g,'').replace(/<br>/g,'')) if (ch !== ' ') charCount++;
    const typingTime = charCount * STEP;

    let inner = `
      <div class="num-row">
        ${idx > 0 ? `<span class="side" data-go="${idx-1}"><span class="arrow">\u25c0</span>${idx}</span>` : `<span class="side" style="opacity:0"></span>`}
        <span class="cur">${idx+1}</span>
        ${idx < slides.length-1 ? `<span class="side" data-go="${idx+1}">${idx+2}<span class="arrow">\u25b6</span></span>` : `<span class="side" style="opacity:0"></span>`}
      </div>
      <div class="wipe"></div><div class="flash"></div>
      <div class="bgline"><svg viewBox="0 0 400 400"><path d="M-50,${180+idx*20} C120,${320-idx*30} 220,${40+idx*40} 450,${200-idx*10}"/></svg></div>
      <div class="content">
        <p class="txt" data-text="${s.text}" style="${s.last ? 'font-size:clamp(24px,5.8vw,44px);' : ''}"></p>`;

    if (s.last) {
      inner += `
        <p class="sub sub-1">네 가지 중 하나를 정해놓고 시작하지 않습니다.</p>
        <div class="icons">
          <div><div class="dot">${icons.cash}</div><span>현금</span></div>
          <div><div class="dot">${icons.card}</div><span>할부</span></div>
          <div><div class="dot">${icons.doc}</div><span>리스</span></div>
          <div><div class="dot">${icons.car}</div><span>장기렌트</span></div>
        </div>
        <p class="sub sub-2" style="font-size:17px;color:${TEAL};margin-top:24px;">당신의 상황이 정확한 점수를 말해줄 뿐입니다.</p>
        <div class="cta"><a href="score.html" id="ctaBtn">내 차이드 스코어 무료 체험해 보기</a></div>
        <a class="more" href="index.html" id="moreLink">슬림더카 탄생 스토리 알아보기</a>`;
    }
    inner += `</div>`;
    sec.innerHTML = inner;
    stage.appendChild(sec);

    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.innerHTML = '<i></i>';
    topbar.appendChild(seg);

    sectionDurations.push(s.last ? null : typingTime + HOLD);
  });

  // CTA/더보기 링크에 캠페인 쿼리스트링을 이어붙이고, CTA 클릭을 GA4에 기록합니다.
  const ctaBtn = document.getElementById('ctaBtn');
  const moreLink = document.getElementById('moreLink');
  if (ctaBtn) {
    ctaBtn.href = 'score.html' + qs;
    ctaBtn.addEventListener('click', () => {
      if (typeof gtag === 'function') gtag('event', 'landing_cta_click');
    });
  }
  if (moreLink) moreLink.href = 'index.html' + qs;

  document.querySelectorAll('.txt[data-text]').forEach(el => {
    const raw = el.dataset.text;
    const words = raw.split(' ');
    let i = 0;
    let html = '';
    words.forEach((w, wi) => {
      if (w === '<br>') { html += '<br>'; return; }
      const inEm = w.indexOf('<em>') === 0;
      const clean = w.replace(/<\/?em>/g,'');
      let wordHtml = '';
      for (const c of clean){
        wordHtml += `<span class="${inEm ? 'ch em' : 'ch'}" style="transition-delay:${(i*STEP).toFixed(3)}s">${c}</span>`;
        i++;
      }
      html += `<span class="word">${wordHtml}</span>`;
      if (wi < words.length - 1 && words[wi+1] !== '<br>') { html += ' '; }
    });
    el.innerHTML = html;
    const totalTyping = i * STEP;
    const sec = el.closest('section');

    const GAP = 0.6;
    const ICON_STEP = 0.45;

    const sub1 = sec.querySelector('.sub-1');
    if (sub1) sub1.style.transitionDelay = (totalTyping + GAP) + 's';

    let t = totalTyping + GAP + 0.7;
    sec.querySelectorAll('.icons div').forEach(div => {
      div.style.transitionDelay = t + 's';
      t += ICON_STEP;
    });

    const sub2 = sec.querySelector('.sub-2');
    if (sub2) { sub2.style.transitionDelay = (t + 0.2) + 's'; t += 0.2 + 0.6; }

    const cta = sec.querySelector('.cta');
    if (cta) cta.style.transitionDelay = (t + 0.3) + 's';
    const more = sec.querySelector('.more');
    if (more) more.style.transitionDelay = (t + 0.7) + 's';
  });

  const sections = document.querySelectorAll('section');
  const segs = topbar.querySelectorAll('.seg');
  let current = 0;
  let timer = null;

  function goTo(idx) {
    if (idx < 0) idx = 0;
    if (idx >= sections.length) return;
    clearTimeout(timer);
    sections.forEach((s, j) => {
      s.classList.toggle('active', j === idx);
      if (j === idx) { s.classList.add('shake'); setTimeout(() => s.classList.remove('shake'), 500); }
    });
    segs.forEach((seg, j) => {
      seg.classList.remove('fill', 'done');
      seg.querySelector('i').style.transition = 'none';
      seg.querySelector('i').style.width = j < idx ? '100%' : '0%';
      if (j < idx) seg.classList.add('done');
    });
    current = idx;
    const dur = sectionDurations[idx];
    if (dur) {
      const seg = segs[idx];
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          seg.classList.add('fill');
          seg.querySelector('i').style.transition = `width ${dur}s linear`;
          seg.querySelector('i').style.width = '100%';
        });
      });
      timer = setTimeout(() => goTo(current + 1), dur * 1000);
    }
  }

  stage.addEventListener('click', (e) => {
    const go = e.target.closest('[data-go]');
    if (go) { goTo(Number(go.dataset.go)); return; }
    if (e.target.closest('#ctaBtn') || e.target.closest('#moreLink')) return;
    if (e.clientX < window.innerWidth * 0.4) goTo(current - 1);
    else goTo(current + 1);
  });

  requestAnimationFrame(() => requestAnimationFrame(() => goTo(0)));
</script>
</body>
</html>
