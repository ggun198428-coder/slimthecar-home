<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --navy:#071D3C;
    --teal:#009AB7;
    --teal-soft:#E8F7FA;
    --gold:#D9A441;
    --gold-soft:#FFF8E9;
    --gray:#5F6B76;
    --gray-soft:#F3F5F6;
    --line:#E3E6E9;
    --bg:#EEF2F5;
    --paper:#FFFFFF;
    --text:#1B2733;
    --text-mute:#5B6672;
    --good:#0E7C5A; --good-soft:#E7F6EF;
    --warn:#B4590E; --warn-soft:#FCEFE2;
    --radius:18px;
    --font:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height:100%;}
  body{
    font-family:var(--font); background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top brand bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; flex:0 0 auto;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:28px;height:28px;border-radius:7px;
    background:linear-gradient(135deg,#0B2545 0%, var(--teal) 100%);
    display:flex;align-items:center;justify-content:center;
    font-weight:800; font-size:13px; color:#fff;
  }
  .brand b{font-size:13.5px; color:var(--navy);}
  .brand span{font-size:10.5px; color:var(--text-mute); margin-left:2px;}
  .step-counter{font-size:11.5px; color:var(--text-mute); font-variant-numeric:tabular-nums;}

  .progress-track{height:4px; background:var(--line); flex:0 0 auto;}
  .progress-fill{height:100%; background:var(--teal); width:0%; transition:width .35s ease;}

  /* ---------- stage (wizard viewport) ---------- */
  .stage{
    flex:1; display:flex; align-items:flex-start; justify-content:center;
    padding:20px; overflow-y:auto;
  }
  .stage{align-items:safe center;} /* 내용이 화면보다 길면 자동으로 위쪽부터, 짧으면 가운데 정렬 (미지원 브라우저는 위 flex-start로 폴백) */
  .card{
    background:var(--paper); border-radius:var(--radius);
    box-shadow:0 20px 60px -20px rgba(7,29,60,0.25), 0 2px 10px rgba(7,29,60,0.06);
    width:100%; max-width:600px;
    padding:40px 36px;
    animation:rise .35s ease;
    position:relative;
  }
  .card.wide{max-width:760px;}
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  .slim-badge-corner{
    position:absolute; top:20px; right:20px; width:118px; z-index:2;
  }
  .slim-badge-corner img{width:100%; height:auto; object-fit:contain; display:block;}
  .chaide-hero-logo{
    width:100%; max-width:340px; height:auto; margin:8px auto 22px; display:block;
  }
  .check-badge{
    width:64px; height:64px; border-radius:16px; margin-bottom:22px;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:28px; color:#fff;
  }
  .intro-tagline{font-size:14.5px; color:var(--text-mute); margin:0 0 22px; line-height:1.6; text-align:center; word-break:keep-all;}
  .intro-hook{font-size:17px; font-weight:800; color:var(--navy); text-align:center; line-height:1.5; margin:34px 0 6px; word-break:keep-all;}
  .intro-hook em{color:var(--teal); font-style:normal;}
  .intro-chaide{
    display:flex; align-items:center; justify-content:center; text-align:center; gap:10px; background:var(--teal-soft);
    border-radius:12px; padding:14px 16px; margin-bottom:22px;
  }
  .intro-chaide .badge{
    font-size:11px; font-weight:800; color:#fff; background:var(--teal);
    padding:3px 9px; border-radius:999px; flex:0 0 auto;
  }
  .intro-chaide p{margin:0; font-size:13px; color:#0E5C6B; line-height:1.55; text-align:center; word-break:keep-all;}
  .intro-chaide p b{color:var(--navy);}

  .intro-tagline-mobile,
  .intro-chaide-mobile{ display:none; }

  @media (max-width:480px){
    .intro-tagline-desktop{ display:none; }
    .intro-tagline-mobile{ display:block; }
    .intro-chaide-desktop{ display:none; }
    .intro-chaide-mobile{ display:block; }
    .chaide-slogan-line{ font-size:12px; }
    .card{ padding:24px 20px; }
    .stage{ padding:12px; }
    .intro-chaide{ padding:12px 14px; }
  }

  .eyebrow{font-size:11.5px; color:var(--teal); font-weight:700; letter-spacing:0.3px; margin-bottom:10px;}
  .qtitle{font-size:22px; font-weight:800; color:var(--navy); line-height:1.35; margin:0 0 8px;}
  .qhelp{font-size:13px; color:var(--text-mute); margin:0 0 26px; line-height:1.6;}

  .options{display:flex; flex-direction:column; gap:10px;}
  .options.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media (max-width:480px){ .options.grid2{grid-template-columns:1fr;} }

  .opt-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border:1.5px solid var(--line); background:#fff; border-radius:12px;
    padding:15px 18px; font-size:14.5px; font-weight:600; color:var(--text);
    cursor:pointer; transition:all .12s ease; text-align:left;
  }
  .opt-btn:hover{border-color:var(--teal); background:var(--teal-soft);}
  .opt-btn.selected{border-color:var(--teal); background:var(--teal); color:#fff;}
  .opt-btn .sub{font-size:11.5px; color:var(--text-mute); font-weight:400; display:block; margin-top:2px;}
  .opt-btn.selected .sub{color:rgba(255,255,255,0.8);}
  .opt-btn .chk{
    width:20px;height:20px;border-radius:50%; border:1.5px solid var(--line); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;
  }
  .opt-btn.selected .chk{background:#fff; color:var(--teal); border-color:#fff;}

  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:28px;}
  .btn{
    border:none; border-radius:10px; padding:12px 22px; font-size:14px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:#0d2c54;}
  .btn-primary:disabled{background:#B9C2CB; cursor:not-allowed;}
  .btn-ghost{background:none; color:var(--text-mute); font-weight:600; padding:12px 6px;}
  .btn-ghost:hover{color:var(--navy);}
  .btn-start{background:var(--teal); color:#fff; font-size:15px; padding:14px 28px; border-radius:12px; width:100%;}

  /* ---------- number/slider question widgets ---------- */

  // ================= STEP RENDERERS =================
  function resolveOptions(q){
    return typeof q.options === 'function' ? q.options() : q.options;
  }

  function choiceStep(q){
    return (root)=>{
      const opts = resolveOptions(q);
      const title = typeof q.title === 'function' ? q.title() : q.title;
      root.innerHTML = `
        <div class="eyebrow">${q.eyebrow}</div>
        <div class="qtitle">${title}</div>
        ${q.help ? `<div class="qhelp">${q.help}</div>` : '<div style="height:26px"></div>'}
        <div class="options ${q.grid2?'grid2':''}" id="optWrap"></div>
        <div class="nav-row">
          <button class="btn btn-ghost" id="backBtn">← 이전</button>
          <span></span>
        </div>`;
      const wrap = root.querySelector('#optWrap');
      const isCustomActive = !opts.some(o=>!o.custom && o.value===state[q.key]) && typeof state[q.key]==='string' && state[q.key] && opts.some(o=>o.custom);
      opts.forEach(opt=>{
        const b = document.createElement('div');
        const selected = opt.custom ? isCustomActive : (state[q.key]===opt.value);
        b.className = 'opt-btn' + (selected ? ' selected' : '');
        b.innerHTML = `<span>${opt.label}${opt.sub?`<span class="sub">${opt.sub}</span>`:''}</span><span class="chk">${selected?'✓':''}</span>`;
        b.addEventListener('click', ()=>{
          if (opt.custom){
            const shown = customBox.style.display !== 'none';
            customBox.style.display = shown ? 'none' : 'block';
            if (!shown) customInput.focus();
          } else {
            state[q.key] = opt.value;
            goNext();
          }
        });
        wrap.appendChild(b);
      });
      const customBox = document.createElement('div');
      const customOpt = opts.find(o=>o.custom);
      const customPlaceholder = (customOpt && customOpt.customPlaceholder) || '직접 입력해주세요';
      customBox.style.cssText = 'display:' + (isCustomActive ? 'block' : 'none') + '; margin-top:10px;';
      customBox.innerHTML = `
        <input type="text" id="customTextInput" placeholder="${customPlaceholder}"
          style="width:100%; padding:14px 16px; border:1.5px solid #ddd; border-radius:12px; font-size:15px; box-sizing:border-box;"
          value="${isCustomActive ? String(state[q.key]).replace(/"/g,'&quot;') : ''}">
        <button class="btn btn-primary" id="customConfirmBtn" style="width:100%; margin-top:10px;">다음 →</button>`;
      wrap.parentNode.insertBefore(customBox, wrap.nextSibling);
      const customInput = customBox.querySelector('#customTextInput');
      customBox.querySelector('#customConfirmBtn').addEventListener('click', ()=>{
        const v = customInput.value.trim();
        if (!v) { customInput.focus(); return; }
        state[q.key] = v;
        goNext();
      });
      customInput.addEventListener('keydown', (e)=>{ if (e.key==='Enter') customBox.querySelector('#customConfirmBtn').click(); });
      root.querySelector('#backBtn').addEventListener('click', goBack);
    };
  }

  const steps = [
    { id:'intro', render: introStep() },
    ...QUESTIONS.map(q=> ({ id:q.key, skip:q.skip, render: choiceStep(q) })),
    { id:'result', render: resultStep },
    { id:'contact', skip: ()=>true, render: contactStep },
  ];

  let cursor = 0;

  function visibleIndices(){
    return steps.map((s,i)=>i).filter(i=> !steps[i].skip || !steps[i].skip());
  }
  function goNext(){
    let i = cursor+1;
    while (i < steps.length && steps[i].skip && steps[i].skip()) i++;
    cursor = Math.min(i, steps.length-1);
    render();
  }
  function goBack(){
    let i = cursor-1;
    while (i >= 0 && steps[i].skip && steps[i].skip()) i--;
    cursor = Math.max(i, 0);
    render();
  }
  function goTo(id){
    cursor = steps.findIndex(s=>s.id===id);
    render();
  }

  function render(){
    const stage = document.getElementById('stage');
    const step = steps[cursor];
    const card = document.createElement('div');
    card.className = 'card' + (step.id==='result' ? ' wide' : '');
    stage.innerHTML = '';
    stage.appendChild(card);
    step.render(card);

    const disclaimerEl = document.getElementById('disclaimer');
    if (disclaimerEl){
      if (step.id === 'contact'){
        disclaimerEl.textContent = '상담 신청 시 입력하신 이름·연락처 등은 상담 목적으로 Formspree(미국)·텔레그램(해외) 등을 통해 전송·저장됩니다. 앞서 답변하신 진단 내용 자체는 별도로 저장되지 않으며, 서비스 개선을 위한 익명 통계만 함께 수집됩니다.';
      } else {
        disclaimerEl.textContent = '이 페이지의 모든 계산은 브라우저 안에서만 이루어집니다. 답변하신 내용 자체는 저장되거나 외부로 전송되지 않으며, 서비스 개선을 위해 방문·진행 단계 등 익명 통계만 수집됩니다.';
      }
    }

    const resultIdx = steps.findIndex(s=>s.id==='result');
    const qStart = 1, qEnd = resultIdx;
    const vis = visibleIndices().filter(i=> i>=qStart && i<qEnd);
    const pos = vis.indexOf(cursor);
    let pct = 0;
    if (cursor===0) pct = 0;
    else if (cursor>=qEnd) pct = 100; // result & contact
    else pct = Math.round(((pos+1)/vis.length)*100);
    document.getElementById('progressFill').style.width = pct+'%';
    document.getElementById('stepCounter').textContent =
      (cursor===0 || cursor>=qEnd) ? '' : (pos+1)+' / '+vis.length;

    window.scrollTo(0,0);
  }

  // ================= ENGINE (FIT — preliminary, pre-quote diagnosis) =================
  // NOTE: There is no real MONEY(경제성) calculation here on purpose — that requires
  // actual quotes, gathered later when the customer requests one. This engine only
  // scores FIT (situation/preference match), per the 8 weighted factors in
  // CHAIDE_SCORE_1.0. The final MONEY×0.6 + FIT×0.4 CHAIDE SCORE is completed once
  // real quotes are in hand.
  function computeFit(){
    const T = state.months||48, km = state.km||17500;
    const vehiclePrice = state.budget||4500;
    const own = state.ownPref||3, disp = state.dispBurden||3, mgmt = state.mgmtPref||3;
    const bizImportance = state.bizPriority||3;
    const insYears = state.insHistory==null?5:state.insHistory;
    const accident = state.accident==='yes';
    // '제한없음'은 현금구매 희망자를 위한 선택지입니다. 계산상 "돈이 무한대로 있다"로 취급해서
    // 초기자금 부족 페널티(아래)가 전혀 붙지 않게 하고, 별도 보너스도 추가로 줍니다.
    const isUnlimitedCash = state.initialCash==='unlimited';
    const initialCash = isUnlimitedCash ? Infinity : (state.initialCash||0);

    const fit = {cash:0, loan:0, lease:0, rent:0};
    const add = (o)=>PRODUCTS.forEach(p=>fit[p]+=o[p]);

    // 이용기간이 짧을수록(특히 2년 이하) 렌트·리스·할부는 짧은 기간에 초기 감가·수수료를
    // 회수해야 해서 월 대여료/할부금이 비싸지는 구조라 현금이 크게 유리해집니다.
    // 반대로 4~5년처럼 중장기로 가면 렌트·리스가 상대적으로 유리해집니다.
    if (T<=24) add({cash:22, loan:8, lease:4, rent:4});
    else if (T<=36) add({cash:14, loan:12, lease:12, rent:12});
    else if (T<=60) add({cash:6, loan:12, lease:19, rent:19});
    else if (T<=84) add({cash:16, loan:18, lease:10, rent:8});
    else add({cash:20, loan:16, lease:6, rent:4});

    const priorityTable = {
      // 리스는 금융상품이라 심사가 렌트보다 까다롭고 보증금·선납금 요구가 높은 편이라 렌트보다
      // 낮게, 다만 명의가 금융사 명의라 심사가 할부보다는 유한 편이라 할부보다는 높게 뒀습니다.
      '초기비용최소화': {cash:2, loan:9, lease:13, rent:18},
      '월납최소화':     {cash:14, loan:8, lease:17, rent:17},
      // '총비용최소화': 실제 견적 사례 분석 결과, 현금의 총비용 우위는 "4년 뒤 매각가가
      // 차량가의 절반을 넘느냐"에 달려있어 FIT 단계(실제 잔가를 모르는 상태)에서 확정할 수
      // 없습니다. 이전에는 현금에 크게 유리하게(16점) 뒀지만, 실제로는 승부가 갈릴 수 있는
      // 사안이라 격차를 줄였습니다. 실제 승자는 MONEY(실제 견적) 단계에서 확정됩니다.
      '총비용최소화':   {cash:14, loan:12, lease:11, rent:10},
    };
    const f2 = Object.assign({}, priorityTable[state.priority||'총비용최소화']);
    // '초기비용최소화'를 이미 선택한 경우 "초기자금이 적다"는 신호가 priorityTable에 이미
    // 크게 반영돼 있습니다(현금 2점 vs 렌트/리스 18점). 여기서 초기자금 조건까지 또 적용하면
    // 같은 신호를 두 번 반영하는 셈이라, 이 경우엔 절반 크기로만 추가 반영합니다.
    if (vehiclePrice>0 && initialCash < vehiclePrice*0.3){
      const dampen = (state.priority==='초기비용최소화') ? 0.5 : 1;
      f2.cash = Math.max(0, f2.cash-6*dampen); f2.loan = Math.max(0, f2.loan-6*dampen);
      f2.lease = Math.min(20, f2.lease+2*dampen); f2.rent = Math.min(20, f2.rent+2*dampen);
    }
    // '제한없음'은 "돈이 부족해서 어쩔 수 없이 특정 방식을 고른다"가 아니라 "원하는 만큼
    // 선납금·보증금·다운페이먼트를 낼 수 있다"는 뜻입니다. 이건 4가지 방식 모두의 총비용을
    // 개선할 수 있는 여력이라, 렌트·리스·할부도 함께 보너스를 받습니다. 다만 현금은 이자·리스
    // 마진 자체가 아예 없어지는 방식이라 총비용 관점에서 가장 크게 유리해집니다.
    if (isUnlimitedCash){
      f2.cash = Math.min(20, f2.cash+10); f2.loan = Math.min(20, f2.loan+5);
      f2.lease = Math.min(20, f2.lease+3); f2.rent = Math.min(20, f2.rent+3);
    }
    add(f2);

    const ownPct=(own-1)/4, dispPct=(disp-1)/4;
    add({
      cash:  15*(0.6*ownPct + 0.4*(1-dispPct)),
      loan:  15*(0.5*ownPct + 0.3*(1-dispPct)),
      lease: 15*(0.2*(1-ownPct) + 0.6*dispPct),
      rent:  15*(0.2*(1-ownPct) + 0.6*dispPct),
    });

    // 현금·할부는 보험·세금·정비를 직접 관리하는 게 동일해서 완전히 같은 값입니다(이전엔
    // 근거 없이 할부가 현금보다 높았던 버그). 렌트는 "관리를 대신 해준다"가 핵심 가치라
    // 직접관리를 원하는 사람에겐 그 가치가 무의미해 0점, 리스는 자동차세 대납·청구대행 정도의
    // 부분적 편의는 있어 baseline을 살짝 남겨뒀습니다. '보통' 구간에서 리스=렌트 동점으로
    // 맞춰서 "직접관리 성향이 강해질 때만 렌트가 리스를 앞서가는" 자연스러운 흐름을 만들었습니다.
    const mgmtTable = {
      1: {cash:5.0, loan:5.0, lease:3.5, rent:0},
      3: {cash:2.5, loan:2.5, lease:5.0, rent:5.0},
      5: {cash:0,   loan:0,   lease:8.0, rent:10.0},
    };
    add(mgmtTable[state.mgmtPref||3]);

    // 부채 부담감: 소유선호(명의)와는 별개 축입니다. 할부는 개인 신용정보에 대출로 명확히
    // 잡히지만, 리스는 상품·계약구조에 따라 잡히는 정도가 다르고(향후자금계획 RISK 문구로
    // 별도 안내), 렌트는 임대서비스 구조라 개인 부채로 안 잡힙니다. 그래서 부담감의 영향을
    // 할부엔 크게(70%), 리스엔 작게(30%), 렌트엔 전혀 안 주는 방식으로 나눴습니다.
    const debtPct = ((state.debtBurden||3)-1)/4; // 0=부담없음 ~ 1=매우 부담
    add({
      cash:  8*debtPct,
      loan:  8*(1-debtPct)*0.7,
      lease: 8*(1-debtPct)*0.3,
      rent:  0,
    });

    // 현금·할부·리스는 모두 개인이 직접 자동차보험에 가입하는 구조라 사고이력·보험경력의
    // 영향이 완전히 동일해야 합니다(이전엔 근거 없이 리스만 더 유리하게 잡혀있었음). 렌트만
    // 렌터카사 자체 보험구조라 개인 이력의 영향을 덜 받아 차별화했습니다. 보험경력은 3~5년과
    // 5년 이상을 구분해서, 경력이 쌓일수록 렌트와의 격차가 더 벌어지도록 세분화했습니다.
    if (accident) add({cash:1, loan:1, lease:1, rent:5});
    else if (insYears<3) add({cash:2.5, loan:2.5, lease:2.5, rent:3.5});
    else if (insYears<5) add({cash:3, loan:3, lease:3, rent:2});
    else add({cash:3, loan:3, lease:3, rent:1});

    // 주행거리 6단계 세분화. 많이 탈수록 감가·정비 리스크가 커지는데, 렌트/리스는 그 리스크를
    // 회사가 떠안는 구조라 다주행 고객에게 유리해집니다. 현금은 항상 할부보다 1점 높게
    // 유지했습니다(할부는 중도 매각·해지 시 중도상환위약금 리스크가 있어 항상 현금보다 낮아야 함).
    const kmTable = [
      {max:5000,  s:{cash:6, loan:5, lease:3, rent:3}},
      {max:12500, s:{cash:5, loan:4, lease:4, rent:4}},
      {max:17500, s:{cash:4, loan:3, lease:5, rent:5}},
      {max:22500, s:{cash:3, loan:2, lease:6, rent:6}},
      {max:27500, s:{cash:2, loan:1, lease:7, rent:7}},
      {max:Infinity, s:{cash:1, loan:0, lease:8, rent:9}},
    ];
    add((kmTable.find(t=>km<=t.max) || kmTable[kmTable.length-1]).s);

    if (state.biz==='개인'){ add({cash:3, loan:3, lease:2, rent:2}); }
    else {
      const scale = bizImportance/5;
      add({cash:1, loan:1+1*(1-scale), lease:2+3*scale, rent:2+3*scale});
    }

    const driverTable = {
      '본인만':        {cash:1.25, loan:1.25, lease:1.25, rent:1.25},
      '본인+배우자':    {cash:1.1,  loan:1.1,  lease:1.4,  rent:1.4},
      '본인+특정1인':   {cash:1.1,  loan:1.1,  lease:1.4,  rent:1.4}, // 배우자와 마찬가지로 고정된 2인 운전 구조라 동일 배점
      '가족(자녀포함)': {cash:0.9,  loan:0.9,  lease:1.55, rent:1.55},
      '직원포함':       {cash:0.5,  loan:0.5,  lease:2,    rent:2},
      '다수불특정':     {cash:0.25, loan:0.25, lease:2.25, rent:2.25},
      // 법인 전용 선택지
      '대표자만':       {cash:1.25, loan:1.25, lease:1.25, rent:1.25},
      '임직원포함':     {cash:0.5,  loan:0.5,  lease:2,    rent:2},
    };
    add(driverTable[state.driver||'본인만']);

    // 번호판: 현금·할부·리스는 모두 일반 번호판이라 한 편이고, 렌트만 렌터카 번호판을 쓰는
    // 다른 편입니다. "상관없어요"(순수 무관심)와 "허·하·호도 괜찮아요"(적극적 긍정)는 신호의
    // 확신도가 다르므로 분리했습니다 — 무관심층까지 렌트 선호로 취급하면 다른 항목들이 만든
    // 성향을 왜곡합니다. 강한긍정의 크기도 6→4로 낮춰 일반 번호판 선호(+4)와 대칭을 맞췄고,
    // 이로써 번호판은 "다른 8개 항목이 만든 격차가 4점 미만인 접전"에서만 결과를 뒤집을 수
    // 있고, 뚜렷한 리드(5점 이상)를 단독으로 뒤집지는 못합니다.
    if (state.plateSensitivity==='general') add({cash:4, loan:4, lease:4, rent:0});
    else if (state.plateSensitivity==='rental_ok') add({cash:0, loan:0, lease:0, rent:4});
    // 'no_pref'는 중립이라 아무 가산도 없음 (의도적으로 분기 없음)

    // 화물트럭·승합밴·픽업트럭(화물 등록 차종)은 영업용 직접사용이든 아니든 법적으로
    // 렌트 자체가 불가능한 차종이라, 렌트 점수는 항상 0으로 고정합니다. 부가세 환급(영업용
    // 직접사용) 대상이면 그 혜택은 리스·할부·현금 쪽에만 반영됩니다.
    const isFreightVehicle = ['화물트럭','승합밴','픽업트럭'].includes(state.vehicleType);
    const isVatDirectUse = state.vatRefund==='yes';
    if (isFreightVehicle){
      fit.rent = 0;
      if (isVatDirectUse){
        // 렌트는 여전히 불가능하지만, 영업용 직접사용은 부가세 매입세액공제(환급) 대상이라
        // 리스·할부·현금의 실질 비용이 낮아집니다. 리스는 환급+비용처리까지 되어 가장 유리.
        fit.lease += 12; fit.loan += 4; fit.cash += 4;
      } else {
        // 렌트 상품이 없는 대신, 비용처리가 가능하고 심사가 상대적으로 유연한 리스로 수요가 몰립니다.
        fit.lease += 8;
      }
    } else if (isVatDirectUse){
      // 경차 등 실제로 렌트가 가능한 차종이면서 영업용 직접사용인 경우엔, 운수업·자동차판매업·
      // 자동차임대업·운전학원업·경비업 등에서 부가세가 포함된 렌트료가 매입세액공제(환급) 대상이라
      // 실질적으로 가장 저렴해집니다. 리스도 환급 대상이라 그다음으로 유리하고,
      // 현금·할부는 이 혜택이 없어 상대적으로 낮게 포지션됩니다.
      fit.rent += 18;
      fit.lease += 8;
      fit.cash = Math.max(0, fit.cash-6);
      fit.loan = Math.max(0, fit.loan-6);
    }

    PRODUCTS.forEach(p=> fit[p]=Math.max(0, Math.min(100, fit[p])));
    return fit;
  }

  function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }

  function buildReasons(top, fit){
    const pos=[], neg=[];
    if (fit[top]>=70) pos.push('답변하신 이용성향과 상품구조가 잘 맞아요');
    if (state.priority==='초기비용최소화' && (top==='lease'||top==='rent')) pos.push('초기자금 최소화 우선순위 반영');
    if (state.priority==='총비용최소화' && (top==='cash'||top==='loan')) pos.push('총비용 최소화 우선순위 반영');
    if ((state.dispBurden||0)>=4 && (top==='lease'||top==='rent')) pos.push('처분 부담 없음 (반납으로 종료)');
    if ((state.mgmtPref||0)>=4 && (top==='lease'||top==='rent')) pos.push('보험·정비·세금 관리 위임 가능');
    if (state.biz!=='개인' && (state.bizPriority||0)>=3 && (top==='lease'||top==='rent')) pos.push('사업자 비용처리 관점에서 유리');
    if ((state.km||0)>22500 && (top==='lease'||top==='rent')) pos.push('많은 주행거리의 감가·정비 리스크를 렌트/리스가 흡수');
    if ((state.km||0)<=12500 && (top==='cash'||top==='loan')) pos.push('주행거리가 적어 감가 부담이 크지 않음');
    if ((state.ownPref||0)>=4 && (top==='cash'||top==='loan')) pos.push('내 명의 소유 선호 반영');
    if ((state.debtBurden||0)>=4 && top==='cash') pos.push('대출·부채 부담을 최소화하고 싶은 성향 반영');
    if ((state.debtBurden||0)<=2 && top==='loan') pos.push('대출·부채에 대한 부담이 적어 할부 활용 여지 있음');
    if (state.plateSensitivity==='general' && (top==='cash'||top==='loan'||top==='lease')) pos.push('일반 번호판 선호 반영');
    if (state.plateSensitivity==='rental_ok' && top==='rent') pos.push('렌터카 번호판에 대한 거부감 없음 반영');
    const isFreightVehicle = ['화물트럭','승합밴','픽업트럭'].includes(state.vehicleType);
    if (isFreightVehicle && top==='lease') pos.push('화물 등록 차종은 렌트가 법적으로 불가능해, 비용처리 가능·심사 유연한 리스로 추천');
    if (state.vatRefund==='yes' && isFreightVehicle && (top==='lease'||top==='loan'||top==='cash')) pos.push('영업용 직접사용 차량은 부가세 환급 대상 (리스·할부·현금 실질비용 절감)');
    if (state.vatRefund==='yes' && !isFreightVehicle && (top==='rent'||top==='lease')) pos.push('영업용 직접사용 차량은 부가세 환급 대상 (렌트·리스료의 부가세 환급 가능)');
    if (pos.length===0) pos.push('전반적으로 무난하게 맞는 조합이에요');

    if ((state.km||0)>22500 && (top==='cash'||top==='loan')) neg.push('주행거리가 많은 편이라 감가·정비 부담을 직접 지게 됨');
    if (isFreightVehicle) neg.push('화물 등록 차종(화물트럭·승합밴·픽업트럭)은 렌트가 법적으로 불가능해 렌트는 추천에서 제외됨');
    if (top==='lease') neg.push('잔존가·반납조건을 계약 전 반드시 확인');
    if (top==='rent') neg.push('중도해지 위약금 조건 확인 필요');
    if (top==='loan') neg.push('중도상환수수료·잔여원금 조건 확인');
    if (top==='cash') neg.push('중고차 매각 시점의 가치 변동 리스크는 고객 부담');
    if ((state.debtBurden||0)>=4 && top==='loan') neg.push('대출·할부금에 부담을 느끼는 편이라 실제 월 납입 여력 재확인 필요');
    if (state.plateSensitivity==='general' && top==='rent') neg.push('일반 번호판을 선호하시는데 장기렌트는 렌터카 번호판이 부착됨');
    if (neg.length===0) neg.push('특이 리스크 없음');
    return {pos, neg};
  }

  const RISK_INFO_BASE = {
    rent:{label:'장기렌트', level:2, text:'면책금·초과주행·반납조건 확인'},
    lease:{label:'리스', level:3, text:'중도 교체 시 정산금(잔존가치 기준) 발생 가능성 확인'},
    loan:{label:'할부', level:2, text:'중도 교체 시 순자산(중고차시세−잔여원금) 확인 필요'},
    cash:{label:'현금구매', level:3, text:'매각가가 차량가 절반 안팎을 넘어야 총비용이 유리해짐'},
  };
  // 리스·할부는 금융상품이라 신용·여신한도에 영향을 줄 수 있습니다. 다만 이건 "리스=부채니까
  // FIT 감점" 같은 방식으로 점수에 반영하지 않고, 향후 자금계획이 있다고 답한 고객에게만
  // RISK(확인해야 할 점) 문구로 조건부 경고합니다. FIT 점수는 이 답변과 무관하게 그대로입니다.
  function getRiskInfo(p){
    let info = RISK_INFO_BASE[p];
    const plan = state.futureFundingPlan;
    const needsFinanceNote = (p==='lease' || p==='loan') && (plan==='있음' || plan==='가능성있음');
    if (needsFinanceNote){
      info = Object.assign({}, info, {
        level: Math.min(5, info.level+1),
        text: info.text + ' · ⚠️ 향후 자금계획이 있다면 이 차량 금융이 여신한도에 영향을 줄 수 있어 사전 확인 필요',
      });
    }
    // 월 리스료엔 보험·세금이 포함되지 않는 경우가 많아, "월납이 싸다"고 오해하기 쉬운
    // 지점을 별도로 경고합니다. (배점은 그대로 두고 RISK 문구로만 다루기로 한 A안)
    if (p==='lease' && state.priority==='월납최소화'){
      info = Object.assign({}, info, {
        level: Math.min(5, info.level+1),
        text: info.text + ' · ⚠️ 리스료엔 보험·세금이 포함 안 돼 있어 실제 월 부담은 직접 확인 필요',
      });
    }
    return info;
  }

  function downloadSummaryText(fit, ranked){
    // html2canvas를 못 쓰는 상황(오프라인 등)을 위한 텍스트 백업 저장 방식입니다.
    const lines = [];
    lines.push('CHAIDE SCORE 진단결과 (슬림더카 × 차이드)');
    lines.push('진단일: '+new Date().toLocaleDateString('ko-KR'));
    lines.push('');
    ranked.forEach((p,i)=> lines.push(`${i+1}위  ${LABEL[p]}  —  ${fmt(fit[p])}점`));
    lines.push('');
    lines.push('※ 이 결과는 이용성향(FIT) 기준 1차 진단입니다.');
    lines.push('   실제 총비용을 반영한 정확한 CHAIDE SCORE는 실제 견적 상담에서 확인하실 수 있어요.');
    lines.push('');
    lines.push('상담 문의: 010-4001-8258 (슬림더카)');
    const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'CHAIDE_SCORE_진단결과.txt';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function downloadSummary(fit, ranked, btnEl){
    // 저장용 이미지는 화면에 보이는 순서와 다르게, "내 점수 바꿔보기"(인터랙티브 버튼)는 빼고
    // 대신 페이지 맨 아래 있는 상담 전화번호 배너는 반드시 포함해서 별도로 조합합니다.
    // 실제 화면(라이브 페이지)은 전혀 건드리지 않고, 화면 밖 임시 복제본에서만 작업합니다.
    const hero = document.querySelector('#resultCaptureArea .result-hero');
    const whyBox = document.querySelector('#resultCaptureArea .why-box');
    const detailBox = document.querySelector('#resultCaptureArea .detail-box');
    const contactBanner = document.querySelector('.contact-banner');
    if (!hero || !whyBox || !detailBox || !contactBanner || typeof html2canvas !== 'function'){
      // 필요한 요소를 못 찾았거나 캡처 라이브러리가 안 뜬 경우(오프라인 등) 텍스트 파일로 대체합니다.
      downloadSummaryText(fit, ranked);
      return;
    }
    const originalLabel = btnEl ? btnEl.textContent : null;
    if (btnEl){ btnEl.textContent = '이미지 만드는 중…'; btnEl.disabled = true; }

    const captureWidth = document.getElementById('resultCaptureArea').offsetWidth || 400;
    const temp = document.createElement('div');
    temp.style.cssText = `position:fixed; left:-9999px; top:0; width:${captureWidth}px; background:#fff;`;
    [hero, whyBox, detailBox, contactBanner].forEach(el=> temp.appendChild(el.cloneNode(true)));
    document.body.appendChild(temp);

    try {
      const canvas = await html2canvas(temp, {
        backgroundColor: '#ffffff',
        scale: Math.min(2, window.devicePixelRatio || 1.5),
        useCORS: true,
      });
      canvas.toBlob((blob)=>{
        if (!blob){ downloadSummaryText(fit, ranked); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'CHAIDE_SCORE_진단결과.png';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 'image/png');
    } catch (e){
      console.warn('결과 이미지 저장 실패, 텍스트로 대체합니다.', e);
      downloadSummaryText(fit, ranked);
    } finally {
      document.body.removeChild(temp);
      if (btnEl){ btnEl.textContent = originalLabel; btnEl.disabled = false; }
    }
  }

        <div class="reason-cols">
          <div class="reason-box pos"><h4>추천을 올린 요인</h4><ul>${pos.map(t=>'<li>'+t+'</li>').join('')}</ul></div>
          <div class="reason-box neg"><h4>상담에서 확인할 요인</h4><ul>${neg.map(t=>'<li>'+t+'</li>').join('')}</ul></div>
        </div>`;

      let riskHtml = '';
      ranked.forEach(p=>{
        const r = getRiskInfo(p);
        const dots = Array.from({length:5},(_,i)=> i<r.level ? '<span class="on">●</span>' : '<span class="off">●</span>').join('');
        riskHtml += `<div class="risk-chip"><b>${r.label}</b><div class="dots">${dots}</div>${r.text}</div>`;
      });
      root.querySelector('#riskWrap').innerHTML = riskHtml;
    }

    function buildReviewPanel(){
      const panel = root.querySelector('#reviewPanel');
      let html = '<div class="review-grid">';
      QUESTIONS.forEach(q=>{
        if (q.skip && q.skip()) return;
        const opts = resolveOptions(q);
        // if a dependency changed and the stored value is no longer a valid option, fall back to the first option
        if (!opts.some(o=>o.value===state[q.key])) state[q.key] = opts[0].value;
        html += `<label class="review-field"><b>${q.eyebrow}</b><select data-key="${q.key}">`;
        opts.forEach((opt,i)=>{
          const selected = state[q.key]===opt.value ? 'selected' : '';
          html += `<option value="${i}" ${selected}>${opt.label}</option>`;
        });
        html += `</select></label>`;
      });
      html += '</div>';
      panel.innerHTML = html;
      panel.querySelectorAll('select[data-key]').forEach(sel=>{
        sel.addEventListener('change', ()=>{
          const q = QUESTIONS.find(qq=>qq.key===sel.dataset.key);
          const opts = resolveOptions(q);
          state[q.key] = opts[parseInt(sel.value)].value;
          buildReviewPanel();   // rebuild in case conditional questions/options changed
          refreshResults();     // instant recalculation
        });
      });
    }

    refreshResults();
    buildReviewPanel();

    const backdrop = root.querySelector('#reviewBackdrop');
    root.querySelector('#toggleReview').addEventListener('click', ()=>{
      backdrop.classList.add('open');
    });
    root.querySelector('#reviewClose').addEventListener('click', ()=>{
      backdrop.classList.remove('open');
    });
    backdrop.addEventListener('click', (e)=>{
      if (e.target === backdrop) backdrop.classList.remove('open');
    });

    root.querySelector('#quoteBtn').addEventListener('click', ()=> goTo('contact'));
    root.querySelector('#saveBtn').addEventListener('click', (e)=> downloadSummary(lastFit, lastRanked, e.currentTarget));

    root.querySelector('#methToggle').addEventListener('click', ()=>{
      const body = root.querySelector('#methBody');
      body.classList.toggle('open');
      root.querySelector('#methToggle').textContent = body.classList.contains('open') ? '이 진단은 어떻게 계산되나요? ▴' : '이 진단은 어떻게 계산되나요? ▾';
    });
  }

  // ================= CONTACT STEP =================
  function contactStep(root){
    const fit = computeFit();
    const ranked = PRODUCTS.slice().sort((a,b)=>fit[b]-fit[a]);
    const top = ranked[0];

    if (typeof gtag === 'function') gtag('event', 'contact_view', { top_product: LABEL[top] });

    root.innerHTML = `
      <div class="eyebrow">실제 견적 받아보기</div>
      <div class="qtitle">연락처를 남겨주시면<br>실제 조건으로 견적을 확인해드릴게요.</div>
      <div class="qhelp">지금까지 답변하신 진단 결과(${LABEL[top]} ${fmt(fit[top])}점)가 함께 전달돼서, 처음부터 다시 설명하지 않으셔도 됩니다.</div>

      <label class="field"><b>이름</b>
        <input type="text" id="c_name" placeholder="홍길동" value="${contact.name}"></label>
      <label class="field" style="margin-top:12px;"><b>휴대폰번호</b>
        <input type="tel" id="c_phone" placeholder="010-1234-5678" value="${contact.phone}"></label>
      <label class="field" style="margin-top:12px;"><b>연락 가능 시간</b>
        <select id="c_time">
          <option value="">선택해주세요</option>
          <option value="언제든 괜찮아요" ${contact.time==='언제든 괜찮아요'?'selected':''}>언제든 괜찮아요</option>
          <option value="오전 9시~10시" ${contact.time==='오전 9시~10시'?'selected':''}>오전 9시~10시</option>
          <option value="오전 10시~11시" ${contact.time==='오전 10시~11시'?'selected':''}>오전 10시~11시</option>
          <option value="오전 11시~12시" ${contact.time==='오전 11시~12시'?'selected':''}>오전 11시~12시</option>
          <option value="오후 12시~1시" ${contact.time==='오후 12시~1시'?'selected':''}>오후 12시~1시</option>
          <option value="오후 1시~2시" ${contact.time==='오후 1시~2시'?'selected':''}>오후 1시~2시</option>
          <option value="오후 2시~3시" ${contact.time==='오후 2시~3시'?'selected':''}>오후 2시~3시</option>
          <option value="오후 3시~4시" ${contact.time==='오후 3시~4시'?'selected':''}>오후 3시~4시</option>
          <option value="오후 4시~5시" ${contact.time==='오후 4시~5시'?'selected':''}>오후 4시~5시</option>
          <option value="오후 5시~6시" ${contact.time==='오후 5시~6시'?'selected':''}>오후 5시~6시</option>
          <option value="저녁 6시 이후" ${contact.time==='저녁 6시 이후'?'selected':''}>저녁 6시 이후</option>
        </select></label>
      <label class="field" style="margin-top:12px;"><b>지역 (탁송 원하는 지역)</b>
        <select id="c_region">
          <option value="">선택해주세요</option>
          <option value="강원/강릉" ${contact.region==='강원/강릉'?'selected':''}>강원/강릉</option>
          <option value="강원/강원영동" ${contact.region==='강원/강원영동'?'selected':''}>강원/강원영동</option>
          <option value="강원/강원영서" ${contact.region==='강원/강원영서'?'selected':''}>강원/강원영서</option>
          <option value="경기/경기남부" ${contact.region==='경기/경기남부'?'selected':''}>경기/경기남부</option>
          <option value="경기/경기북구" ${contact.region==='경기/경기북구'?'selected':''}>경기/경기북구</option>
          <option value="경남/부산" ${contact.region==='경남/부산'?'selected':''}>경남/부산</option>
          <option value="경북/대구" ${contact.region==='경북/대구'?'selected':''}>경북/대구</option>
          <option value="서울" ${contact.region==='서울'?'selected':''}>서울</option>
          <option value="세종" ${contact.region==='세종'?'selected':''}>세종</option>
          <option value="수원" ${contact.region==='수원'?'selected':''}>수원</option>
          <option value="울산" ${contact.region==='울산'?'selected':''}>울산</option>
          <option value="인천/인천강화" ${contact.region==='인천/인천강화'?'selected':''}>인천/인천강화</option>
          <option value="인천/인천공한" ${contact.region==='인천/인천공한'?'selected':''}>인천/인천공한</option>
          <option value="전남/광주" ${contact.region==='전남/광주'?'selected':''}>전남/광주</option>
          <option value="전북/전주" ${contact.region==='전북/전주'?'selected':''}>전북/전주</option>
          <option value="제주" ${contact.region==='제주'?'selected':''}>제주</option>
          <option value="창원" ${contact.region==='창원'?'selected':''}>창원</option>
          <option value="충남/대전" ${contact.region==='충남/대전'?'selected':''}>충남/대전</option>
          <option value="충북/청주" ${contact.region==='충북/청주'?'selected':''}>충북/청주</option>
        </select></label>

      <div class="consent-row">
        <input type="checkbox" id="c_consent" ${contact.consent?'checked':''}>
        <label for="c_consent">개인정보 수집·이용 및 국외 이전에 동의합니다.<br>
          <span style="opacity:.85;">수집항목: 이름·연락처·지역·상담내용 / 목적: 상담 제공 / 보유기간: 상담 완료 후 파기<br>
          국외 이전받는 자: Formspree Inc.(미국), Telegram Messenger Inc.(해외) / 이전 목적: 상담 접수·알림 처리</span>
        </label>
      </div>

      <div class="submit-error" id="submitError" style="display:none;"></div>

      <div class="nav-row">
        <button class="btn btn-ghost" id="backBtn">← 이전</button>
        <button class="btn btn-primary" id="submitBtn" disabled>제출하고 견적 받기</button>
      </div>`;

    const inputs = ['c_name','c_phone','c_time','c_region'].map(id=>root.querySelector('#'+id));
    const consentBox = root.querySelector('#c_consent');
    const submitBtn = root.querySelector('#submitBtn');
    const errorBox = root.querySelector('#submitError');

    function validate(){
      const ok = root.querySelector('#c_name').value.trim().length>0
        && root.querySelector('#c_phone').value.trim().length>=9
        && root.querySelector('#c_time').value.trim().length>0
        && root.querySelector('#c_region').value.trim().length>0
        && consentBox.checked;
      submitBtn.disabled = !ok;
    }
    inputs.forEach(el=> el.addEventListener('input', validate));
    consentBox.addEventListener('change', validate);
    validate();

    root.querySelector('#backBtn').addEventListener('click', ()=> goTo('result'));

    submitBtn.addEventListener('click', async ()=>{
      contact.name = root.querySelector('#c_name').value.trim();
      contact.phone = root.querySelector('#c_phone').value.trim();
      contact.time = root.querySelector('#c_time').value;
      contact.region = root.querySelector('#c_region').value.trim();
      contact.consent = consentBox.checked;

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '전송 중…';

      const detailLines = ranked.map((p,i)=> `${i+1}위 ${LABEL[p]} ${fmt(fit[p])}점`).join('\n');
      const payload = {
        _subject: `[차이드스코어] ${contact.name}님 상담신청 — ${LABEL[top]} ${fmt(fit[top])}점`,
        이름: contact.name,
        휴대폰번호: contact.phone,
        연락가능시간: contact.time || '(선택 안함)',
        지역: contact.region || '(선택 안함)',
        진단_1순위: `${LABEL[top]} ${fmt(fit[top])}점`,
        진단_전체순위: detailLines,
        고객유형: state.biz,
        이용목적: state.purpose,
        선호차량: state.vehicleType,
        운전자범위: state.driver,
        예산대: state.budget,
        연간주행거리: state.km,
        이용기간_개월: state.months,
        초기자금: state.initialCash==='unlimited' ? '제한없음' : state.initialCash,
        비용우선순위: state.priority,
        소유선호: findOptionLabel('ownPref', state.ownPref),
        처분부담: findOptionLabel('dispBurden', state.dispBurden),
        관리선호: findOptionLabel('mgmtPref', state.mgmtPref),
        보험경력: findOptionLabel('insHistory', state.insHistory),
        사고이력: findOptionLabel('accident', state.accident),
        사업자비용처리중요도: state.biz==='개인' ? '(해당없음)' : findOptionLabel('bizPriority', state.bizPriority),
        영업용직접사용: state.vatRefund==null ? '(해당없음)' : findOptionLabel('vatRefund', state.vatRefund),
        번호판선호: state.plateSensitivity==null ? '(해당없음)' : findOptionLabel('plateSensitivity', state.plateSensitivity),
        부채부담감: findOptionLabel('debtBurden', state.debtBurden),
        향후자금계획: findOptionLabel('futureFundingPlan', state.futureFundingPlan),
      };

      const telegramText =
        `🚗 <b>새 상담신청 도착!</b>\n\n` +
        `<b>이름</b>: ${contact.name}\n` +
        `<b>휴대폰</b>: ${contact.phone}\n` +
        `<b>연락가능시간</b>: ${contact.time || '(선택 안함)'}\n` +
        `<b>지역</b>: ${contact.region || '(선택 안함)'}\n` +
        `<b>고객유형</b>: ${state.biz}\n` +
        `<b>이용목적</b>: ${state.purpose || '-'}\n` +
        `<b>선호차량</b>: ${state.vehicleType || '-'}\n` +
        `<b>운전자범위</b>: ${state.driver || '-'}\n` +
        `<b>예산대</b>: ${state.budget || '-'}만원 · <b>연간주행거리</b>: ${state.km || '-'}km · <b>이용기간</b>: ${state.months || '-'}개월\n` +
        `<b>초기자금</b>: ${state.initialCash==='unlimited' ? '제한없음' : (state.initialCash||'-')} · <b>비용우선순위</b>: ${state.priority || '-'}\n` +
        `<b>소유선호</b>: ${findOptionLabel('ownPref', state.ownPref)||'-'} · <b>처분부담</b>: ${findOptionLabel('dispBurden', state.dispBurden)||'-'} · <b>관리선호</b>: ${findOptionLabel('mgmtPref', state.mgmtPref)||'-'}\n` +
        `<b>보험경력</b>: ${findOptionLabel('insHistory', state.insHistory)||'-'} · <b>사고이력</b>: ${findOptionLabel('accident', state.accident)||'-'}\n` +
        (state.biz!=='개인' ? `<b>사업자비용처리중요도</b>: ${findOptionLabel('bizPriority', state.bizPriority)||'-'}\n` : '') +
        (state.vatRefund!=null ? `<b>영업용직접사용</b>: ${findOptionLabel('vatRefund', state.vatRefund)||'-'}\n` : '') +
        (state.plateSensitivity!=null ? `<b>번호판선호</b>: ${findOptionLabel('plateSensitivity', state.plateSensitivity)||'-'}\n` : '') +
        `<b>부채부담감</b>: ${findOptionLabel('debtBurden', state.debtBurden)||'-'} · <b>향후자금계획</b>: ${findOptionLabel('futureFundingPlan', state.futureFundingPlan)||'-'}\n` +
        `\n<b>진단결과 1위</b>: ${LABEL[top]} ${fmt(fit[top])}점\n` +
        `${detailLines}`;
      // 텔레그램·구글시트 백업·Formspree 세 곳에 동시에 보냅니다. 텔레그램과 구글시트는
      // 결과를 기다리지 않는 부가 채널이라, 실패해도 신청 자체(Formspree)를 막지 않습니다.
      sendTelegramNotification(telegramText);
      sendSheetsBackup(payload);

      try {
        const res = await fetch(FORMSPREE_ENDPOINT, {
          method: 'POST',
          headers: {'Content-Type':'application/json', 'Accept':'application/json'},
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          if (typeof gtag === 'function') gtag('event', 'contact_submit', { top_product: LABEL[top] });
          root.innerHTML = `
            <div class="check-badge" style="background:linear-gradient(135deg,#0B2545 0%, var(--teal) 100%);">✓</div>
            <div class="qtitle">감사합니다, ${contact.name}님!</div>
            <div class="qhelp">
              ${contact.time ? contact.time+'에 ' : ''}남겨주신 연락처로 곧 연락드릴게요.<br><br>
              진단 결과 — <b>${LABEL[top]} ${fmt(fit[top])}점</b> — 와 답변하신 조건이 함께 전달되어,
              상담에서 처음부터 다시 설명하실 필요 없이 실제 시세·견적 확인부터 이어집니다.
            </div>
            <button class="btn btn-primary" id="doneBtn" style="width:100%;">처음으로</button>`;
          root.querySelector('#doneBtn').addEventListener('click', ()=>{ cursor=0; render(); });
          return;
        }

        // Formspree returned an error response — surface its own message when available
        // (matches the response shape documented in Formspree's AJAX guide: { errors: [{ field, message }] }).
        const data = await res.json().catch(()=>null);
        let msg = '전송에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.';
        if (data && Array.isArray(data.errors) && data.errors.length) {
          msg = data.errors.map(e=> e.message || e.field).join(' / ');
        } else if (data && data.error) {
          msg = data.error;
        }
        throw new Error(msg);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = '제출하고 견적 받기';
        errorBox.style.display = 'block';
        errorBox.textContent = (err && err.message ? err.message : '전송에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.')
          + ' 계속 실패하면 ' + (contact.phone || '연락처') + '로 직접 연락드릴 수 있도록 화면을 캡처해 보내주세요.';
      }
    });
  }

  render();
})();
</script>
</body>
</html>
