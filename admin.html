const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5); // a-b
const md=s=>s?`${+s.slice(5,7)}/${+s.slice(8,10)}`:'';
const dt=iso=>{if(!iso)return'';const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const dayOf=iso=>ymd(new Date(iso));
const addMonths=(d,n)=>{if(!d)return null;const x=new Date(d+'T00:00:00');const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return ymd(x)};
function parseDate(v){if(v==null||v==='')return null;if(typeof v=='number'){const d=new Date(Math.round((v-25569)*864e5));return ymd(d)}
 v=String(v).trim();let m=v.match(/^(\d{4})[-./\s]*(\d{1,2})[-./\s]*(\d{1,2})/);if(m)return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
 m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){const y=m[3].length==2?'20'+m[3]:m[3];return `${y}-${pad(m[1])}-${pad(m[2])}`}
 if(/^\d{5}$/.test(v))return parseDate(+v);return null}
const won=v=>{const n=String(v||'').replace(/[^\d]/g,'');return n?(+n).toLocaleString():''};
const expDue=end=>end?addMonths(end,-6):null;

const normPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length==10&&d.startsWith('10'))d='0'+d;if(d.length==9&&d.startsWith('2'))d='0'+d;if(d.startsWith('02')&&(d.length==9||d.length==10))return `02-${d.slice(2,d.length-4)}-${d.slice(-4)}`;if(d.length==11)return `${d.slice(0,3)}-${d.slice(3,7)}-${d.slice(7)}`;if(d.length==10)return `${d.slice(0,3)}-${d.slice(3,6)}-${d.slice(6)}`;return p?String(p).trim():null};

const quiet=c=>{const t=c.last_contact_at||c.created_at;return dayDiff(TODAY(),dayOf(t))};

const waitQ=c=>c.stage=='quote'&&quiet(c)>=2;

function expTag(c){const e=(c.contract||{}).end_date;if(!e)return'-';const n=dayDiff(e,TODAY());const mo=Math.round(n/30.4);
 const cls=n<0?'t-gray':n<=93?'t-red':n<=186?'t-amb':'t-navy';return `<span class="tag ${cls}">${n<0?'만기 지남':mo>=1?mo+'개월 남음':n+'일 남음'}</span> <span style="font-size:12px;color:var(--sub)">${e}</span>`}
